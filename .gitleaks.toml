# Gitleaks configuration
# Target specific false positives in test mock data without disabling project-wide secret scanning.
# Documentation: https://github.com/gitleaks/gitleaks

[allowlist]
description = "Allowlist test files used strictly for automated tests"
paths = [
  '''src[/\\]config[/\\]env\.test\.ts''',
  '''src[/\\]observability[/\\]logger\.test\.ts''',
  '''src[/\\]index\.test\.ts'''
]

